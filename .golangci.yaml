# Repo golangci-lint config; tighten gradually.
version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - unused
  settings:
    govet:
      disable:
        - fieldalignment
        - shadow
  exclusions:
    paths:
      - third_party$
      - builtin$
      - examples$
      - proto/

formatters:
  enable:
    - gofmt
    - goimports
