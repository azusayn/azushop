services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 270153
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # TODO: registry (zookeeper / kRaft).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://host.docker.internal:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  envoy:
    image: envoyproxy/envoy:v1.38.0
    container_name: envoy
    command: ["-c", "/etc/envoy/dev.envoy.yaml", "--log-level", "info"]
    ports:
      - "9901:9901"
      - "10000:10000"
    volumes:
      - ./dev.envoy.yaml:/etc/envoy/dev.envoy.yaml:ro
    extra_hosts:
      # Reach host-process services (configs/*.yaml ports 8000–8004).
      - "host.docker.internal:host-gateway"
    depends_on:
      - grafana
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    networks:
      default:
        aliases:
          # Match helm default clickhouse.service.name so compose can mount the chart datasource file.
          - clickhouse-service
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - GF_PLUGINS_DISABLE=grafana-exploretraces-app
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SERVER_ROOT_URL=/grafana/
    volumes:
      - grafana-data:/var/lib/grafana
      - ../helm-charts/azushop/configs/infra/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - clickhouse
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command:
      - --config=/etc/otelcol/config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-config.yml:/etc/otelcol/config.yml
    depends_on:
      - clickhouse
    restart: unless-stopped


volumes:
  pgdata:
  clickhouse-data:
  grafana-data:
