static_resources:
  listeners:
    - name: azushop_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: grpc_proxy
                codec_type: AUTO
                http_protocol_options: {}
                http2_protocol_options: {}
                route_config:
                  name: grpc_routes
                  virtual_hosts:
                    - name: azushop
                      domains: ["*"]
                      routes:
                        # HTTP REST API routes (to HTTP ports)
                        - match:
                            prefix: "/v1/auth"
                          route:
                            cluster: auth_http_cluster
                            timeout: 30s
                        - match:
                            prefix: "/v1/inventory"
                          route:
                            cluster: inventory_http_cluster
                            timeout: 30s
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: product_http_cluster
                            timeout: 30s
                        - match:
                            prefix: "/v1/orders"
                          route:
                            cluster: order_http_cluster
                            timeout: 30s
                        - match:
                            prefix: "/v1/payment"
                          route:
                            cluster: payment_http_cluster
                            timeout: 30s
                        # gRPC routes (to gRPC ports)
                        - match:
                            prefix: "/auth.v1.AuthService"
                          route:
                            cluster: auth_grpc_cluster
                        - match:
                            prefix: "/inventory.v1.InventoryService"
                          route:
                            cluster: inventory_grpc_cluster
                        - match:
                            prefix: "/product.v1.ProductService"
                          route:
                            cluster: product_grpc_cluster
                        - match:
                            prefix: "/order.v1.OrderService"
                          route:
                            cluster: order_grpc_cluster
                        - match:
                            prefix: "/payment.v1.PaymentService"
                          route:
                            cluster: payment_grpc_cluster
                      cors:
                        allow_origin_string_match:
                          - safe_regex:
                              regex: ".*"
                        allow_methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
                        allow_headers: "content-type, authorization, x-requested-with"
                        expose_headers: "content-length, content-type"
                        max_age: "86400"
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Auth Service - HTTP (port 8000)
    - name: auth_http_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth_http_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8000

    # Auth Service - gRPC (port 9000)
    - name: auth_grpc_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: auth_grpc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 9000

    # Product Service - HTTP (port 8001)
    - name: product_http_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: product_http_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 8001

    # Product Service - gRPC (port 9002)
    - name: product_grpc_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
