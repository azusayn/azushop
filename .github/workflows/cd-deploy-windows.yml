# Helm deploy for Windows runners (PowerShell).
name: CD Deploy Windows

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Windows runner that can reach the target cluster'
        required: true
        default: 'self-hosted'
        type: string
  workflow_call:
    inputs:
      runner:
        description: 'Windows runner that can reach the target cluster'
        required: false
        type: string
        default: 'self-hosted'

jobs:
  deploy:
    name: helm-deploy
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell

    steps:
      # IMPORTANT: The Windows self-hosted runner machine must have core.autocrlf
      # disabled (git config --global core.autocrlf false) for this workflow to work.
      # Without this, Git will convert LF → CRLF on checkout, causing Atlas migration
      # checksum mismatches. The .gitattributes eol=lf rules alone are not sufficient
      # if the runner's global git config overrides them.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve azushop image tag
        id: meta
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          # Prefer GITHUB_SHA over git rev-parse on Windows self-hosted runners.
          # git commands fail with "dubious ownership" because actions/checkout sets
          # safe.directory in a temporary HOME that doesn't persist for PowerShell steps.
          $tag = $env:GITHUB_SHA.Substring(0, 7)
          $image = "$($env:DOCKER_USERNAME)/azushop:$tag"
          # Avoid PowerShell >> UTF-16; append UTF-8 for GITHUB_OUTPUT.
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image_tag=$tag$([Environment]::NewLine)")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "image=$image$([Environment]::NewLine)")
          Write-Host "Deploying $image on runner=${{ inputs.runner }}"

      - name: Ensure minikube is running
        run: |
          minikube status
          if ($LASTEXITCODE -ne 0) {
            Write-Host "minikube not ready; starting..."
            minikube start
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pull image into minikube
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          minikube image pull $env:IMAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Helm upgrade --install
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          helm upgrade --install azushop ./helm-charts/azushop `
            -n azushop `
            --create-namespace `
            --reuse-values `
            --set "services.image=$($env:IMAGE)" `
            --set "services.imagePullPolicy=IfNotPresent" `
            --set "stripe.secretKey=$($env:STRIPE_SECRET_KEY)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait for business deployments
        run: |
          foreach ($svc in @("auth", "inventory", "order", "payment", "product")) {
            Write-Host "=== rollout status $svc ==="
            kubectl rollout status "deploy/$svc" -n azushop --timeout=300s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Show deploy status
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          Write-Host "Image: $($env:IMAGE)"
          helm list -n azushop
          kubectl get pods -n azushop
          kubectl get deploy -n azushop auth inventory order payment product -o wide
