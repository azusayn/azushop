# PR checks against main. Image build runs in cd-main.yml only after the PR is merged.
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true

      - name: Run golangci-lint
        run: golangci-lint run --verbose --timeout 10m ./...

  proto-lint:
    name: proto-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          breaking: false
          # Workflow only has contents:read; commenting needs pull-requests:write.
          pr_comment: false

  go-test:
    name: go-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run tests
        run: go test ./...

  atlas-sum:
    name: atlas-sum
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Install atlas
        run: |
          curl -sSfL https://release.ariga.io/atlas/atlas-linux-amd64-latest -o /tmp/atlas
          sudo install -m 755 /tmp/atlas /usr/local/bin/atlas
          atlas version

      - name: Verify migrations atlas.sum
        run: |
          atlas migrate hash --dir "file://helm-charts/azushop/migrations"
          git diff --exit-code -- helm-charts/azushop/migrations/atlas.sum
