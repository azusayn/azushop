# PR checks against main. Image build runs in cd-main.yml only after the PR is merged.
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          install-only: true

      - name: Run golangci-lint
        run: golangci-lint run --verbose --timeout 10m ./...

  proto-lint:
    name: proto-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: proto
          lint: true
          format: false
          breaking: false

  go-test:
    name: go-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code

      - name: Run tests
        run: go test ./...

  # Atlas officially recommends committing atlas.sum from developers and failing CI on
  # mismatch (to surface concurrent migration edits). We deliberately do the opposite:
  # regenerate and push atlas.sum here so local/PR authors do not have to coordinate
  # migration-file conflicts across developers.
  atlas-sum:
    name: atlas-sum
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Commit back onto the PR head branch, not the ephemeral merge ref.
          ref: ${{ github.head_ref }}

      - name: Install atlas
        run: |
          curl -sSfL https://release.ariga.io/atlas/atlas-linux-amd64-latest -o /tmp/atlas
          sudo install -m 755 /tmp/atlas /usr/local/bin/atlas
          atlas version

      - name: Regenerate atlas.sum and commit if changed
        run: |
          atlas migrate hash --dir "file://helm-charts/azushop/migrations"
          if git diff --quiet -- helm-charts/azushop/migrations/atlas.sum; then
            echo "atlas.sum already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add helm-charts/azushop/migrations/atlas.sum
            git commit -m "chore(migrations): regenerate atlas.sum"
            git push
          fi

      - name: Validate migrations with Atlas
        run: |
          # Validate that migrations are consistent and checksums match.
          # This catches line-ending drift and other migration file issues early.
          atlas migrate validate --dir "file://helm-charts/azushop/migrations"
