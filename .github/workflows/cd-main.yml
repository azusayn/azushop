# Runs only when a pull request is merged into main.
# Direct pushes to main do not start this workflow.
# 1) Build/push image on ubuntu (:latest + :<short-sha>)
# 2) Helm upgrade --install on the self-hosted cluster runner (cd-deploy.yml)
name: CD

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build-dockerfile.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  deploy:
    name: deploy
    needs: docker-build
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/cd-deploy.yml
    secrets: inherit
    with:
      runner: self-hosted
      image_tag: ${{ needs.docker-build.outputs.image_tag }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
