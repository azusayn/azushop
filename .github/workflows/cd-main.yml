# Runs only when a pull request is merged into main.
# Direct pushes to main do not start this workflow.
# Runner is ubuntu for now. Switch to self-hosted later when this job also drives cluster deploys.
name: CD

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cd-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: docker-build
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build-dockerfile.yml
    secrets: inherit
    with:
      runner: ubuntu-24.04
      ref: ${{ github.event.pull_request.merge_commit_sha }}
