# Build and push multi-arch image with :latest and :<short-sha> tags.
# Default runner: ubuntu-24.04.
name: Build Dockerfile

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner environment'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
      ref:
        description: 'Git ref or SHA to checkout (empty = current SHA)'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      runner:
        description: 'Runner environment'
        required: false
        type: string
        default: 'ubuntu-24.04'
      ref:
        description: 'Git ref or SHA to checkout (merged commit for CD)'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'Short git SHA used as the image tag'
        value: ${{ jobs.build.outputs.image_tag }}
      image:
        description: 'Full image reference with short SHA tag'
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Resolve image tags
        id: meta
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          repo="${{ secrets.DOCKER_USERNAME }}/azushop"
          {
            echo "image_tag=${short_sha}"
            echo "image=${repo}:${short_sha}"
            echo "tags=${repo}:latest,${repo}:${short_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${repo}:latest and ${repo}:${short_sha}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-arch Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./misc/Dockerfile
          push: true
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          # GHA cache quota/races must not fail the job after a successful push.
          cache-to: type=gha,mode=max,ignore-error=true
