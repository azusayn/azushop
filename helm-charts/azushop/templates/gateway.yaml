apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: azushop-gateway
spec:
  gatewayClassName: envoy
    - name: http
      protocol: HTTP
      port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: azushop-http-route
spec:
  parentRefs:
    - name: azushop-gateway
  hostnames:
    - {{ .Values.ingress.host }}
  rules:
    {{- range .Values.ingress.services }}
    - matches:
      - path:
          type: PathPrefix
          value: {{ .path | quote }}
      backendRefs:
        - name: {{ .name }}
          port: {{ .port }}
    {{- end }}