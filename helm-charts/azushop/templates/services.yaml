# deployments
{{- $image := .Values.services.image -}}
{{- range .Values.services.names }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ . }}
spec:
  selector:
    matchLabels:
      app: {{ . }}
  template:
    metadata:
      labels:
        app: {{ . }}
    spec:
      containers:
        - name: {{ . }}
          image: {{ $image }}
          command:
            - "/usr/local/bin/{{ . }}"
          env:
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secret
                  key: STRIPE_SECRET_KEY
          volumeMounts:
            - name: configs-volume
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: configs-volume
          secret:
            secretName: azushop-config

{{- end}}

# services
{{- range .Values.services.names }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.}}
spec:
  type: ClusterIP
  selector:
    app: {{.}}
  ports:
    - port: 8080
      targetPort: 8080
{{- end}}

# secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: azushop-config
type: Opaque
data: {{-  (.Files.Glob "configs/services/*").AsSecrets | nindent 2 }}
{{- if .Values.stripe.secretKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-secret
type: Opaque
stringData:
  STRIPE_SECRET_KEY: {{ .Values.stripe.secretKey | quote }}
{{- end }}
