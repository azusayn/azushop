# deployments
{{- $image := .Values.services.image -}}
{{- range .Values.services.names }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ . }}
spec:
  replicas: {{ $.Values.services.replicas }}
  selector:
    matchLabels:
      app: {{ . }}
  template:
    metadata:
      labels:
        app: {{ . }}
    spec:
      containers:
        - name: {{ . }}
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.services.imagePullPolicy }}
          command:
            - "/usr/local/bin/{{ . }}"
          env:
            - name: STRIPE_SECRET_KEY
              value: {{ $.Values.stripe.secretKey | quote }}
          volumeMounts:
            - name: configs-volume
              mountPath: {{ $.Values.services.config.mountPath }}
              readOnly: true
      volumes:
        - name: configs-volume
          secret:
            secretName: {{ $.Values.services.config.secretName }}

{{- end}}

# services
{{- range .Values.services.names }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{.}}
spec:
  type: {{ $.Values.services.service.type }}
  selector:
    app: {{.}}
  ports:
    - port: {{ $.Values.services.service.port }}
      targetPort: {{ $.Values.services.service.targetPort }}
{{- end}}

# secrets
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.services.config.secretName }}
type: Opaque
data:
  auth.yaml: {{ tpl (.Files.Get "configs/services/auth.yaml") . | b64enc }}
  inventory.yaml: {{ tpl (.Files.Get "configs/services/inventory.yaml") . | b64enc }}
  order.yaml: {{ tpl (.Files.Get "configs/services/order.yaml") . | b64enc }}
  payment.yaml: {{ tpl (.Files.Get "configs/services/payment.yaml") . | b64enc }}
  product.yaml: {{ tpl (.Files.Get "configs/services/product.yaml") . | b64enc }}
  dev.private.pem: {{ .Files.Get "configs/services/dev.private.pem" | b64enc }}
  dev.public.pem: {{ .Files.Get "configs/services/dev.public.pem" | b64enc }}
