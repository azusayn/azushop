apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki.yaml: |
{{ .Files.Get "configs/infra/loki.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
spec:
  serviceName: "loki-service"
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.7.2
          args: ["-config.file=/etc/loki/config/loki.yaml"]
          ports:
            - containerPort: 3100
              name: http
          volumeMounts:
            - name: loki-data
              mountPath: /loki
            - name: config-volume
              mountPath: /etc/loki/config
      volumes:
        - name: config-volume
          configMap:
            name: loki-config
  volumeClaimTemplates:
    - metadata:
        name: loki-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: loki-service
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
      name: http
