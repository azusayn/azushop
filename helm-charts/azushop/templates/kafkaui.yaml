apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafkaui
spec:
  selector:
    matchLabels:
      app: kafkaui
  template:
    metadata:
      labels:
        app: kafkaui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: local
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-service:9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafkaui
spec:
  selector:
    app: kafkaui
  ports:
    - port: 8092
      targetPort: 8080
