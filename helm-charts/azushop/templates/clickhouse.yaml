apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-users
data:
  default-user.xml: |
{{ .Files.Get "configs/infra/clickhouse-users.xml" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.clickhouse.service.name }}
spec:
  serviceName: {{ .Values.clickhouse.service.name }}
  replicas: {{ .Values.clickhouse.replicas }}
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          ports:
            - containerPort: {{ .Values.clickhouse.service.httpPort }}
              name: http
            - containerPort: {{ .Values.clickhouse.service.nativePort }}
              name: native
          volumeMounts:
            - name: clickhouse-data
              mountPath: {{ .Values.clickhouse.persistence.mountPath }}
            - name: clickhouse-users
              mountPath: /etc/clickhouse-server/users.d/default-user.xml
              subPath: default-user.xml
              readOnly: true
      volumes:
        - name: clickhouse-users
          configMap:
            name: clickhouse-users
  volumeClaimTemplates:
    - metadata:
        name: clickhouse-data
      spec:
        accessModes: {{ toYaml .Values.clickhouse.persistence.accessModes | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.clickhouse.service.name }}
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: {{ .Values.clickhouse.service.httpPort }}
      targetPort: {{ .Values.clickhouse.service.httpPort }}
    - name: native
      port: {{ .Values.clickhouse.service.nativePort }}
      targetPort: {{ .Values.clickhouse.service.nativePort }}
