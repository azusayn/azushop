receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  clickhouse:
    endpoint: tcp://{{ .Values.clickhouse.service.name }}:{{ .Values.clickhouse.service.nativePort }}
    database: {{ .Values.clickhouse.auth.database }}
    username: {{ .Values.clickhouse.auth.username }}
    password: {{ .Values.clickhouse.auth.password | quote }}
    traces_table_name: otel_traces
    logs_table_name: otel_logs
    create_schema: true
    timeout: 5s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
